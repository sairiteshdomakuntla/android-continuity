<!DOCTYPE html>
<html>
<head>
  <title>OBS WebRTC Test</title>
</head>
<body style="background:purple;color:white;font-family:sans-serif;font-size:36px;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div id="status">Checking WebRTC...</div>
  <script>
    const status = document.getElementById('status');
    if (typeof RTCPeerConnection !== 'undefined') {
      status.innerText = 'RTCPeerConnection: AVAILABLE!';
      status.style.color = '#00ff88';
      document.body.style.background = '#053315';
    } else {
      status.innerText = 'RTCPeerConnection: NOT AVAILABLE';
      status.style.color = '#ff4444';
      document.body.style.background = '#330505';
    }
  </script>
</body>
</html>
