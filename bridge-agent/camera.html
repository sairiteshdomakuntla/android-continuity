<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge — Phone Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e6edf7;
      background: #0b0f14;
      --bg: #0b0f14;
      --panel: #11161d;
      --line: #1e293b;
      --ink: #e6edf7;
      --ink-soft: #9db0c7;
      --muted: #64748b;
      --accent: #0b57d0;
      --rec: #dc2626;
      --live: #22c55e;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--ink);
    }

    /* ── Minimal dark title bar ─────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 10px 0 14px;
      background: rgba(17, 22, 29, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
      gap: 8px;
      z-index: 5;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0b0f14;
      flex-shrink: 0;
    }
    .top-bar-title {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.1px;
      color: var(--ink);
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.live {
      background: var(--live);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }
    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-text.live {
      color: var(--ink);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .btn-stop {
      background: var(--rec);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: filter 0.15s ease-out;
      -webkit-app-region: no-drag;
    }
    .btn-stop:hover {
      filter: brightness(1.1);
    }
    .btn-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.15s ease-out, color 0.15s ease-out;
      -webkit-app-region: no-drag;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-close:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* ── Video area ───────────────────────────────────────────── */
    .video-area {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      background: #000;
      position: relative;
      overflow: hidden;
      padding: 0;
    }
    .video-frame {
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      background: #000;
      box-shadow: none;
      display: flex;
      padding: 0;
      position: relative;
      overflow: hidden;
    }
    .video-inner {
      flex: 1;
      border-radius: 0;
      overflow: hidden;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #cam-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }
    #cam-video.active {
      display: block;
    }

    /* Waiting state */
    .waiting-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0b0f14;
      transition: opacity 0.25s ease-out;
    }
    .waiting-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .waiting-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1e293b;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .waiting-label {
      font-size: 14px;
      font-weight: 650;
      color: var(--ink);
      text-align: center;
      line-height: 1.6;
    }
    .waiting-sub {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--ink-soft);
    }

    /* Ended state */
    .ended-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0b0f14;
    }
    .ended-overlay.visible {
      display: flex;
    }
    .ended-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: #1e293b;
      color: var(--ink-soft);
    }
    .ended-label {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    /* LIVE badge */
    .live-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--rec);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.1px;
      padding: 5px 12px;
      border-radius: 9999px;
      display: none;
      align-items: center;
      gap: 7px;
      z-index: 2;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
    }
    .live-badge.visible {
      display: inline-flex;
    }
    .live-badge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>

<body>
  <!-- ── Custom title bar ─────────────────────────────────────── -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="brand-icon">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-3.2.3-4.3 1-4.9 2z"/></svg>
      </span>
      <span class="top-bar-title">Bridge Camera</span>
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Waiting for Android…</span>
    </div>
    <div class="top-bar-right">
      <button class="btn-stop" id="btn-stop" title="Stop camera stream">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
        <span>Stop</span>
      </button>
      <button class="btn-close" id="btn-close" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- ── Video area ───────────────────────────────────────────── -->
  <div class="video-area">
    <div class="video-frame">
      <div class="video-inner">
        <video id="cam-video" autoplay playsinline muted></video>

        <div class="waiting-overlay" id="waiting-overlay">
          <div class="waiting-spinner"></div>
          <div class="waiting-label">Waiting for Android camera…<br /><span class="waiting-sub">Keep Bridge open on your phone</span></div>
        </div>

        <div class="ended-overlay" id="ended-overlay">
          <div class="ended-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><path d="m2 2 20 20"/></svg>
          </div>
          <div class="ended-label">Stream ended</div>
        </div>

        <div class="live-badge" id="live-badge">Live</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/camera.ts"></script>
</body>

</html>
