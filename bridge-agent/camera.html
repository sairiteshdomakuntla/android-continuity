<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge — Phone Camera</title>
  <style>
    @font-face {
      font-family: 'Fraunces';
      font-style: normal;
      font-weight: 600;
      src: url('/assets/fonts/fraunces-semibold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Nunito Sans';
      font-style: normal;
      font-weight: 400;
      src: url('/assets/fonts/nunito-sans-regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Nunito Sans';
      font-style: normal;
      font-weight: 700;
      src: url('/assets/fonts/nunito-sans-bold.woff2') format('woff2');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
      color: #2f2620;
      background: #f4eee3;
      --linen: #f4eee3;
      --card: #fcf9f3;
      --sand: #e5d9c4;
      --clay: #bc5e36;
      --clay-deep: #9c4a28;
      --clay-soft: #f3e2d3;
      --clay-ink: #8a3f22;
      --sage: #6f7f5c;
      --sage-deep: #57663f;
      --ink: #2f2620;
      --ink-soft: #6e6155;
      --muted: #a29382;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--linen);
      user-select: none;
      font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
      color: var(--ink);
    }

    /* ── Custom minimal title bar ─────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 10px 0 16px;
      background: var(--linen);
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
      gap: 8px;
    }
    .top-bar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--clay);
      opacity: 0.55;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .brand-icon {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--clay);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #faf5ea;
      flex-shrink: 0;
    }
    .top-bar-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
    }

    /* Status indicator — calm static dot, sage when live */
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #c9bda9;
      flex-shrink: 0;
    }
    .status-dot.live {
      background: var(--sage);
    }
    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-text.live {
      color: var(--sage-deep);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .btn-stop {
      background: var(--clay);
      border: none;
      color: #fdf8ef;
      font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease-out;
      -webkit-app-region: no-drag;
    }
    .btn-stop:hover {
      background: var(--clay-deep);
    }
    .btn-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.15s ease-out, color 0.15s ease-out;
      -webkit-app-region: no-drag;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-close:hover {
      background: var(--clay-soft);
      color: var(--clay-ink);
    }

    /* ── Video area ───────────────────────────────────────────── */
    .video-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--linen);
      position: relative;
      overflow: hidden;
      padding: 18px;
    }
    .video-frame {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 1px solid var(--sand);
      background: var(--card);
      box-shadow: 0 10px 30px rgba(122, 90, 58, 0.1), 0 2px 6px rgba(122, 90, 58, 0.08);
      display: flex;
      padding: 8px;
      position: relative;
      overflow: hidden;
    }
    .video-inner {
      flex: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #241d16;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #cam-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #241d16;
    }
    #cam-video.active {
      display: block;
    }

    /* Waiting state overlay */
    .waiting-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--card);
      transition: opacity 0.25s ease-out;
    }
    .waiting-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .waiting-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--sand);
      border-top-color: var(--clay);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .waiting-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      line-height: 1.55;
    }
    .waiting-sub {
      font-size: 12px;
      font-weight: 400;
      color: var(--ink-soft);
    }

    /* Ended state */
    .ended-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--card);
    }
    .ended-overlay.visible {
      display: flex;
    }
    .ended-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #ede4d2;
      color: var(--ink-soft);
    }
    .ended-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    /* LIVE badge — calm clay pill */
    .live-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--clay);
      color: #fdf8ef;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      padding: 4px 11px;
      border-radius: 9999px;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }
    .live-badge.visible {
      display: inline-flex;
    }
    .live-badge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fdf8ef;
    }
  </style>
</head>

<body>
  <!-- ── Custom title bar ─────────────────────────────────────── -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="brand-icon">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-3.2.3-4.3 1-4.9 2z"/></svg>
      </span>
      <span class="top-bar-title">Bridge Camera</span>
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Waiting for Android…</span>
    </div>
    <div class="top-bar-right">
      <button class="btn-stop" id="btn-stop" title="Stop camera stream">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
        <span>Stop</span>
      </button>
      <button class="btn-close" id="btn-close" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- ── Video area ───────────────────────────────────────────── -->
  <div class="video-area">
    <div class="video-frame">
      <div class="video-inner">
        <video id="cam-video" autoplay playsinline muted></video>

        <div class="waiting-overlay" id="waiting-overlay">
          <div class="waiting-spinner"></div>
          <div class="waiting-label">Waiting for Android camera…<br /><span class="waiting-sub">Keep Bridge open on your phone</span></div>
        </div>

        <div class="ended-overlay" id="ended-overlay">
          <div class="ended-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><path d="m2 2 20 20"/></svg>
          </div>
          <div class="ended-label">Stream ended</div>
        </div>

        <div class="live-badge" id="live-badge">Live</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/camera.ts"></script>
</body>

</html>
